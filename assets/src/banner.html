<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Shift banner</title>
<style>
  :root {
    --navy: #070d1a;
    --lime: #c8f135;
    --orange: #f5a524;
    --ink: #f4f7ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 500px; overflow: hidden; background: var(--navy); }
  body { font-family: "Inter", "Manrope", "Noto Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1600px; height: 500px; background: var(--navy); }

  /* ---- photo, left ---- */
  .photo { position: absolute; left: 0; top: 0; width: 760px; height: 500px; overflow: hidden; }
  .photo img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 42%;
    display: block; filter: brightness(1.1) contrast(1.03) saturate(1.08);
  }
  .fade {
    position: absolute; left: 0; top: 0; width: 760px; height: 500px;
    background: linear-gradient(90deg,
      rgba(7,13,26,0) 0%,
      rgba(7,13,26,0) 26%,
      rgba(7,13,26,0.15) 42%,
      rgba(7,13,26,0.42) 54%,
      rgba(7,13,26,0.72) 62%,
      rgba(7,13,26,1) 68%,
      rgba(7,13,26,1) 100%);
  }
  /* keep the blown-out morning haze off the left edge */
  .fade-left {
    position: absolute; left: 0; top: 0; width: 760px; height: 500px;
    background: linear-gradient(90deg, rgba(7,13,26,0.62) 0%, rgba(7,13,26,0) 20%);
  }
  .fade-bottom {
    position: absolute; left: 0; top: 0; width: 760px; height: 500px;
    background: linear-gradient(to top, rgba(7,13,26,0.34) 0%, rgba(7,13,26,0) 24%);
  }

  /* ---- copy, right ---- */
  .copy {
    position: absolute; left: 800px; top: 0;
    width: 760px; height: 500px;
    display: flex; flex-direction: column; justify-content: center;
    padding-bottom: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 12px;
    align-self: flex-start;
    padding: 10px 22px 10px 18px;
    border: 2px solid var(--lime);
    border-radius: 999px;
    background: rgba(200, 241, 53, 0.08);
    margin-bottom: 22px;
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px rgba(200,241,53,0.9); }
  .chip span { font-size: 21px; font-weight: 600; letter-spacing: 0.05em; color: var(--ink); white-space: nowrap; }
  h1 { font-size: 162px; font-weight: 900; line-height: 0.855; letter-spacing: -0.04em; }
  h1 .a { color: #ffffff; display: block; }
  h1 .b { color: var(--lime); display: block; }
  .rule { width: 120px; height: 8px; border-radius: 4px; background: var(--orange); margin: 26px 0 20px; }
  .tagline { font-size: 45px; font-weight: 700; line-height: 1.14; letter-spacing: -0.022em; color: #ffffff; }
  .tagline em { font-style: normal; color: var(--lime); }
</style>
</head>
<body>
  <div class="stage">
    <div class="photo"><img src="karim_crop.jpg" alt="Karim, a farmer in Bangladesh, looking up at the sky"></div>
    <div class="fade-bottom"></div>
    <div class="fade-left"></div>
    <div class="fade"></div>
    <div class="copy">
      <div class="chip"><i class="dot"></i><span>Team Orion &nbsp;·&nbsp; NASA Space Apps 2026</span></div>
      <h1><span class="a">FIELD</span><span class="b">SHIFT</span></h1>
      <div class="rule"></div>
      <div class="tagline">Earth data for <em>smarter farms</em></div>
    </div>
  </div>
</body>
</html>
