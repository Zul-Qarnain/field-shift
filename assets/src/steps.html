<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Shift — how it works in three steps</title>
<style>
  :root {
    --navy: #070d1a;
    --panel: #0e1a2e;
    --edge: #24374f;
    --lime: #c8f135;
    --ink: #f4f7ff;
    --muted: #a3b6d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 420px; overflow: hidden; background: var(--navy); }
  body { font-family: "Inter", "Manrope", "Noto Sans", sans-serif; -webkit-font-smoothing: antialiased; }

  .wrap { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 38px; }
  .card {
    width: 452px; height: 340px; flex: 0 0 452px;
    background: linear-gradient(158deg, #12223c 0%, var(--panel) 60%);
    border: 1.5px solid var(--edge);
    border-radius: 24px;
    padding: 30px 34px;
    display: flex; flex-direction: column;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .num {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2.5px solid var(--lime); color: var(--lime);
    font-size: 21px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .icon {
    width: 82px; height: 82px; border-radius: 20px;
    background: rgba(200,241,53,0.10);
    border: 1.5px solid rgba(200,241,53,0.32);
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 56px; height: 56px; }
  h3 {
    margin-top: 34px;
    font-size: 33px; font-weight: 800; line-height: 1.13;
    letter-spacing: -0.022em; color: var(--ink);
  }
  p {
    margin-top: 18px;
    font-size: 23.5px; font-weight: 500; line-height: 1.44;
    color: var(--muted); letter-spacing: -0.008em;
  }
  p b { color: #e2ebf8; font-weight: 700; }
  p .hi { color: var(--lime); font-weight: 700; }
  .arrow { width: 82px; flex: 0 0 82px; height: 340px; display: flex; align-items: center; justify-content: center; }
  .arrow svg { width: 58px; height: 58px; }
</style>
</head>
<body>
  <div class="wrap">

    <!-- 1 · satellites -->
    <div class="card">
      <div class="top">
        <span class="num">1</span>
        <span class="icon">
          <svg viewBox="0 0 48 48" fill="none" stroke="#c8f135" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <g transform="rotate(-20 24 20)">
              <rect x="1" y="15.5" width="12" height="9" rx="1.6"/>
              <rect x="35" y="15.5" width="12" height="9" rx="1.6"/>
              <line x1="5" y1="15.5" x2="5" y2="24.5" stroke-width="1.9"/>
              <line x1="9" y1="15.5" x2="9" y2="24.5" stroke-width="1.9"/>
              <line x1="39" y1="15.5" x2="39" y2="24.5" stroke-width="1.9"/>
              <line x1="43" y1="15.5" x2="43" y2="24.5" stroke-width="1.9"/>
              <line x1="13" y1="20" x2="17.6" y2="20"/>
              <line x1="30.4" y1="20" x2="35" y2="20"/>
              <rect x="17.6" y="13" width="12.8" height="14" rx="2.6"/>
              <line x1="17.6" y1="20" x2="30.4" y2="20" stroke-width="2"/>
            </g>
            <line x1="24" y1="31.5" x2="24" y2="36.5" stroke-dasharray="3 3.4" stroke-width="2.4"/>
            <circle cx="24" cy="42" r="3.4" fill="#c8f135" stroke="none"/>
          </svg>
        </span>
      </div>
      <h3>Satellites watch<br>the Earth</h3>
      <p><b>NASA POWER</b> weather, plus <span class="hi">CHIRPS</span> rainfall.</p>
    </div>

    <div class="arrow">
      <svg viewBox="0 0 48 48" fill="none" stroke="#c8f135" stroke-width="4.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="6" y1="24" x2="39" y2="24"/><polyline points="28,12 40,24 28,36"/>
      </svg>
    </div>

    <!-- 2 · engine -->
    <div class="card">
      <div class="top">
        <span class="num">2</span>
        <span class="icon">
          <svg viewBox="0 0 48 48" fill="none" stroke="#c8f135" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3.5" width="30" height="41" rx="5"/>
            <rect x="14.5" y="8.5" width="19" height="9" rx="2"/>
            <line x1="17.5" y1="13" x2="26" y2="13" stroke-width="2"/>
            <g fill="#c8f135" stroke="none">
              <circle cx="17.5" cy="25" r="2.1"/><circle cx="24" cy="25" r="2.1"/><circle cx="30.5" cy="25" r="2.1"/>
              <circle cx="17.5" cy="32" r="2.1"/><circle cx="24" cy="32" r="2.1"/><circle cx="30.5" cy="32" r="2.1"/>
              <circle cx="17.5" cy="39" r="2.1"/><circle cx="24" cy="39" r="2.1"/><circle cx="30.5" cy="39" r="2.1"/>
            </g>
          </svg>
        </span>
      </div>
      <h3>Field Shift<br>does the maths</h3>
      <p>Checks <b>every crop rotation that fits</b>, scores it, shows the working.</p>
    </div>

    <div class="arrow">
      <svg viewBox="0 0 48 48" fill="none" stroke="#c8f135" stroke-width="4.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="6" y1="24" x2="39" y2="24"/><polyline points="28,12 40,24 28,36"/>
      </svg>
    </div>

    <!-- 3 · plan -->
    <div class="card">
      <div class="top">
        <span class="num">3</span>
        <span class="icon">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 45.5 C24 37 23.6 27 23.4 15" stroke="#c8f135" stroke-width="2.6"
                  stroke-linecap="round" fill="none"/>
            <g fill="#c8f135">
              <ellipse cx="24" cy="8.5" rx="3.1" ry="5.6"/>
              <ellipse cx="18" cy="16" rx="3.1" ry="5.6" transform="rotate(-34 18 16)"/>
              <ellipse cx="30" cy="16" rx="3.1" ry="5.6" transform="rotate(34 30 16)"/>
              <ellipse cx="18" cy="24.5" rx="3.1" ry="5.6" transform="rotate(-34 18 24.5)"/>
              <ellipse cx="30" cy="24.5" rx="3.1" ry="5.6" transform="rotate(34 30 24.5)"/>
              <ellipse cx="18" cy="33" rx="3.1" ry="5.6" transform="rotate(-34 18 33)"/>
              <ellipse cx="30" cy="33" rx="3.1" ry="5.6" transform="rotate(34 30 33)"/>
            </g>
          </svg>
        </span>
      </div>
      <h3>Karim gets<br>a plan</h3>
      <p><b>Ranked crop plans</b> in Bangla or English, with the reason for each.</p>
    </div>

  </div>
</body>
</html>
